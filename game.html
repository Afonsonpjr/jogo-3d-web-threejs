<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Seila — Game (VR)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body { margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #info { position:absolute;left:12px;bottom:12px;color:#e6edf3;font-size:12px;background:rgba(0,0,0,0.55);padding:8px 10px;border-radius:8px;pointer-events:none;user-select:none;max-width:260px;line-height:1.35;z-index:10; }
    #vr-hint { position:absolute;right:12px;bottom:12px;color:#e6edf3;font-size:12px;background:rgba(0,0,0,0.55);padding:8px 10px;border-radius:8px;pointer-events:none;user-select:none;z-index:10; }
  </style>
</head>
<body>
  <div id="info">PC: WASD + Shift (correr) + Espaço (pulo) + Clique (interagir) + V (push-to-talk)<br>Mobile: analogue virtual + botones (pulo, agarrar, correr)<br>VR: clique no botão "Enter VR" quando aparecer.</div>
  <div id="vr-hint">VR via WebXR (headsets compat).</div>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.Fog(0x05070a, 10, 60);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.6, 4);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));
    const hemi = new THREE.HemisphereLight(0x88ccff, 0x223344, 0.8);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(5, 10, 7);
    dir.castShadow = true;
    scene.add(dir);
    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1f29 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x60a5fa });
    for (let i = 0; i < 12; i++) {
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.set((Math.random() - 0.5) * 20, 0.5, (Math.random() - 0.5) * 20);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
    }
    const keys = { w:false, a:false, s:false, d:false, shift:false, space:false, v:false };
    const moveState = { forward:0, right:0, up:0, run:false, pushToTalk:false };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') keys.w = true;
      if (e.code === 'KeyA') keys.a = true;
      if (e.code === 'KeyS') keys.s = true;
      if (e.code === 'KeyD') keys.d = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
      if (e.code === 'Space') keys.space = true;
      if (e.code === 'KeyV') { keys.v = true; moveState.pushToTalk = true; }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') keys.w = false;
      if (e.code === 'KeyA') keys.a = false;
      if (e.code === 'KeyS') keys.s = false;
      if (e.code === 'KeyD') keys.d = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
      if (e.code === 'Space') keys.space = false;
      if (e.code === 'KeyV') { keys.v = false; moveState.pushToTalk = false; }
    });
    renderer.setAnimationLoop(() => {
      moveState.forward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
      moveState.right = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
      moveState.run = !!keys.shift;
      moveState.up = keys.space ? 1 : 0;
      const speed = moveState.run ? 0.12 : 0.06;
      const direction = new THREE.Vector3();
      camera.getWorldDirection(direction);
      direction.y = 0;
      direction.normalize();
      const right = new THREE.Vector3();
      right.crossVectors(camera.up, direction).normalize();
      if (moveState.forward !== 0) camera.position.addScaledVector(direction, moveState.forward * speed);
      if (moveState.right !== 0) camera.position.addScaledVector(right, -moveState.right * speed);
      if (moveState.up !== 0) camera.position.y += 0.08;
      renderer.render(scene, camera);
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
