<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo 3D - Menu Principal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; }
        #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .menu-content { text-align: center; max-width: 600px; width: 90%; }
        h1 { font-size: 48px; margin-bottom: 10px; background: linear-gradient(90deg, #4CAF50, #45a049); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { font-size: 18px; color: #aaa; margin-bottom: 40px; }
        .btn { display: block; width: 100%; max-width: 400px; margin: 15px auto; padding: 18px 30px; background: rgba(76,175,80,0.2); border: 2px solid #4CAF50; border-radius: 12px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn:hover { background: rgba(76,175,80,0.4); transform: scale(1.05); }
        .btn span { margin-right: 10px; }
        .btn-ar { background: rgba(33,150,243,0.2); border-color: #2196F3; }
        .btn-ar:hover { background: rgba(33,150,243,0.4); }
        .btn-vr { background: rgba(156,39,176,0.2); border-color: #9C27B0; }
        .btn-vr:hover { background: rgba(156,39,176,0.4); }
        .btn-multi { background: rgba(255,152,0,0.2); border-color: #FF9800; }
        .btn-multi:hover { background: rgba(255,152,0,0.4); }
        .btn-guest { background: rgba(76,175,80,0.2); border-color: #4CAF50; }
        .btn-guest:hover { background: rgba(76,175,80,0.4); }
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        .version { position: fixed; bottom: 20px; right: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div id="menu">
        <div class="menu-content">
            <h1>🎮 Jogo 3D Web</h1>
            <p class="subtitle">Three.js + Cannon.js + WebXR</p>
            <a href="game.html" class="btn"><span>🎮</span> Jogar</a>
            <a href="ar-mode.html" class="btn btn-ar"><span>📱</span> AR Mode</a>
            <a href="vr-mode.html" class="btn btn-vr"><span>🥽</span> VR Mode</a>
            <a href="multiplayer.html" class="btn btn-multi"><span>🌐</span> Multiplayer</a>
            <a href="game.html" class="btn btn-guest" onclick="event.preventDefault(); alert('Guest Book em desenvolvimento!');"><span>📝</span> Guest Book</a>
        </div>
    </div>
    <div class="version">v1.0.0 - Afonso Pereira</div>
    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
    <script type="module">
        import * as THREE from 'three';
        const canvas = document.getElementById('canvas-bg');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 20; }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ color: 0x4CAF50, size: 0.05 });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = (e.clientX / window.innerWidth) * 2 - 1; mouseY = -(e.clientY / window.innerHeight) * 2 + 1; });
        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.x += 0.001; particles.rotation.y += 0.001;
            particles.position.x += (mouseX - particles.position.x) * 0.05;
            particles.position.y += (mouseY - particles.position.y) * 0.05;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        console.log('✅ Menu carregado!');
    </script>
</body>
</html>
