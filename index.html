<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo 3D - Agarrar e Arremessar</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: white; transition: opacity 0.5s;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #4CAF50; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-text { font-size: 18px; margin-bottom: 10px; }
        #loading-subtext { font-size: 14px; color: #aaa; }
        #error-message {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #ff4444;
            color: white; padding: 30px; border-radius: 10px; z-index: 1001;
            max-width: 500px; text-align: center;
        }
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 20px;
            border-radius: 10px; font-size: 14px; pointer-events: none; z-index: 100;
        }
        #ui-overlay h2 { margin-bottom: 10px; font-size: 18px; color: #4CAF50; }
        .control-item { margin: 5px 0; display: flex; align-items: center; gap: 10px; }
        .key {
            background: #333; padding: 4px 8px; border-radius: 4px;
            font-weight: bold; min-width: 30px; text-align: center; border: 1px solid #555;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; pointer-events: none; z-index: 50;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
        #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
        #grab-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #4CAF50; font-size: 16px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 51; display: none;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Carregando jogo 3D...</div>
        <div id="loading-subtext">Inicializando Three.js e Cannon.js</div>
    </div>
    
    <div id="error-message">
        <h2>⚠️ Erro ao carregar</h2>
        <p id="error-details"></p>
        <p style="margin-top: 15px; font-size: 14px;">Verifique se seu navegador suporta WebGL 2.0</p>
    </div>

    <div id="canvas-container">
        <div id="ui-overlay">
            <h2>🎮 Controles</h2>
            <div class="control-item"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span>Mover</span></div>
            <div class="control-item"><span class="key">Shift</span><span>Correr</span></div>
            <div class="control-item"><span class="key">Mouse</span><span>Olhar</span></div>
            <div class="control-item"><span class="key">Clique E</span><span>Agarrar/Soltar</span></div>
            <div class="control-item"><span class="key">R</span><span>Resetar Objetos</span></div>
        </div>
        <div id="crosshair"></div>
        <div id="grab-indicator">PEGAR</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        const config = {
            walkSpeed: 5, runSpeed: 10, jumpForce: 5,
            grabDistance: 4, throwForce: 15, holdForce: 250, gravity: -9.82
        };

        let scene, camera, renderer, controls;
        let world, physicsBodies = [], visualMeshes = [];
        let heldObject = null, heldBody = null, holdConstraint = null;
        let raycaster;
        const keys = { w: false, a: false, s: false, d: false, shift: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let isInitialized = false;

        function showError(message) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-details').textContent = message;
            console.error('Erro:', message);
        }

        function hideLoading() {
            document.getElementById('loading-screen').classList.add('hidden');
        }

        function init() {
            try {
                // Verificar WebGL
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                if (!gl) {
                    showError('Seu navegador não suporta WebGL. Tente Chrome, Firefox ou Edge.');
                    return;
                }

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 2, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('canvas-container').appendChild(renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(50, 50, 50);
                directionalLight.castShadow = true;
                directionalLight.shadow.camera.left = -50;
                directionalLight.shadow.camera.right = 50;
                directionalLight.shadow.camera.top = 50;
                directionalLight.shadow.camera.bottom = -50;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                scene.add(directionalLight);

                controls = new PointerLockControls(camera, document.body);
                document.addEventListener('click', () => {
                    if (!controls.isLocked) controls.lock();
                    else tryGrab();
                });
                scene.add(controls.getObject());

                raycaster = new THREE.Raycaster();

                world = new CANNON.World();
                world.gravity.set(0, config.gravity, 0);
                world.broadphase = new CANNON.SAPBroadphase(world);
                world.allowSleep = true;

                createFloor();
                createObjects();
                setupEventListeners();
                
                isInitialized = true;
                hideLoading();
                animate();
                
                console.log('✅ Jogo inicializado com sucesso!');
            } catch (error) {
                showError('Erro ao inicializar: ' + error.message);
            }
        }

        function createFloor() {
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x3a5f3a, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);
        }

        function createObjects() {
            const geometries = [
                { type: 'box', geo: new THREE.BoxGeometry(1, 1, 1) },
                { type: 'sphere', geo: new THREE.SphereGeometry(0.6, 32, 32) },
                { type: 'cylinder', geo: new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32) }
            ];
            const colors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff];

            for (let i = 0; i < 20; i++) {
                const item = geometries[Math.floor(Math.random() * geometries.length)];
                const geo = item.geo;
                const mat = new THREE.MeshStandardMaterial({ 
                    color: colors[Math.floor(Math.random() * colors.length)],
                    roughness: 0.5, metalness: 0.3
                });
                
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 30,
                    2 + Math.random() * 5,
                    (Math.random() - 0.5) * 30
                );
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                visualMeshes.push(mesh);

                let shape;
                if (item.type === 'box') {
                    shape = new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5));
                } else if (item.type === 'sphere') {
                    shape = new CANNON.Sphere(0.6);
                } else if (item.type === 'cylinder') {
                    shape = new CANNON.Cylinder(0.5, 0.5, 1.5, 32);
                }

                const body = new CANNON.Body({
                    mass: 1 + Math.random() * 4,
                    shape: shape,
                    position: new CANNON.Vec3(mesh.position.x, mesh.position.y, mesh.position.z),
                    linearDamping: 0.5, angularDamping: 0.5
                });
                
                world.addBody(body);
                physicsBodies.push(body);
                mesh.userData.physicsBody = body;
            }
        }

        function setupEventListeners() {
            document.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = true; break;
                    case 'KeyA': keys.a = true; break;
                    case 'KeyS': keys.s = true; break;
                    case 'KeyD': keys.d = true; break;
                    case 'ShiftLeft': keys.shift = true; break;
                    case 'KeyR': resetObjects(); break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = false; break;
                    case 'KeyA': keys.a = false; break;
                    case 'KeyS': keys.s = false; break;
                    case 'KeyD': keys.d = false; break;
                    case 'ShiftLeft': keys.shift = false; break;
                }
            });

            window.addEventListener('resize', () => {
                if (!isInitialized) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function tryGrab() {
            if (heldObject) releaseObject();
            else {
                const rayOrigin = camera.position.clone();
                const rayDirection = new THREE.Vector3();
                camera.getWorldDirection(rayDirection);
                raycaster.set(rayOrigin, rayDirection);
                raycaster.far = config.grabDistance;

                const intersects = raycaster.intersectObjects(visualMeshes);
                if (intersects.length > 0) {
                    const target = intersects[0].object;
                    const body = target.userData.physicsBody;
                    if (body && body.mass > 0) holdObject(target, body);
                }
            }
        }

        function holdObject(mesh, body) {
            heldObject = mesh;
            heldBody = body;

            const holdPosition = new THREE.Vector3();
            camera.getWorldDirection(holdPosition);
            holdPosition.multiplyScalar(2.5);
            holdPosition.add(camera.position);

            const holdBody = new CANNON.Body({
                mass: 0,
                position: new CANNON.Vec3(holdPosition.x, holdPosition.y, holdPosition.z)
            });
            world.addBody(holdBody);

            holdConstraint = new CANNON.PointToPointConstraint(
                body, new CANNON.Vec3(0, 0, 0),
                holdBody, new CANNON.Vec3(0, 0, 0)
            );
            world.addConstraint(holdConstraint);

            body.linearDamping = 0.9;
            body.angularDamping = 0.9;
            document.getElementById('grab-indicator').style.display = 'none';
        }

        function releaseObject() {
            if (!heldBody || !holdConstraint) return;

            const throwDirection = new THREE.Vector3();
            camera.getWorldDirection(throwDirection);
            throwDirection.multiplyScalar(config.throwForce);

            heldBody.velocity.set(throwDirection.x, throwDirection.y * 0.5, throwDirection.z);

            world.removeConstraint(holdConstraint);
            world.removeBody(holdBody);

            heldBody.linearDamping = 0.5;
            heldBody.angularDamping = 0.5;

            heldObject = null; heldBody = null; holdConstraint = null;
        }

        function updateGrabIndicator() {
            if (heldObject) return;
            const rayOrigin = camera.position.clone();
            const rayDirection = new THREE.Vector3();
            camera.getWorldDirection(rayDirection);
            raycaster.set(rayOrigin, rayDirection);
            raycaster.far = config.grabDistance;

            const intersects = raycaster.intersectObjects(visualMeshes);
            const indicator = document.getElementById('grab-indicator');
            if (intersects.length > 0 && intersects[0].object.userData.physicsBody?.mass > 0) {
                indicator.style.display = 'block';
            } else {
                indicator.style.display = 'none';
            }
        }

        function resetObjects() {
            visualMeshes.forEach((mesh, i) => {
                mesh.position.set((Math.random() - 0.5) * 30, 2 + Math.random() * 5, (Math.random() - 0.5) * 30);
                mesh.rotation.set(0, 0, 0);
                if (physicsBodies[i]) {
                    physicsBodies[i].position.set(mesh.position.x, mesh.position.y, mesh.position.z);
                    physicsBodies[i].velocity.set(0, 0, 0);
                    physicsBodies[i].angularVelocity.set(0, 0, 0);
                }
            });
            if (heldObject) releaseObject();
        }

        function updatePlayer(delta) {
            if (!controls.isLocked) return;
            direction.z = Number(keys.w) - Number(keys.s);
            direction.x = Number(keys.d) - Number(keys.a);
            direction.normalize();

            const speed = keys.shift ? config.runSpeed : config.walkSpeed;
            if (keys.w || keys.s) velocity.z = direction.z * speed * delta; else velocity.z = 0;
            if (keys.a || keys.d) velocity.x = direction.x * speed * delta; else velocity.x = 0;

            controls.moveRight(velocity.x);
            controls.moveForward(velocity.z);

            if (camera.position.y < 2) { camera.position.y = 2; }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(0.1, 1/60);
            world.step(1/60);

            for (let i = 0; i < physicsBodies.length; i++) {
                visualMeshes[i].position.copy(physicsBodies[i].position);
                visualMeshes[i].quaternion.copy(physicsBodies[i].quaternion);
            }

            if (heldObject && heldBody) {
                const holdPosition = new THREE.Vector3();
                camera.getWorldDirection(holdPosition);
                holdPosition.multiplyScalar(2.5);
                holdPosition.add(camera.position);
                heldBody.position.set(holdPosition.x, holdPosition.y, holdPosition.z);
            }

            updatePlayer(delta);
            updateGrabIndicator();
            renderer.render(scene, camera);
        }

        // Inicializar quando DOM estiver pronto
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
