<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo 3D - Física Personagem</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; justify-content: center; align-items: center; z-index: 1000; color: white; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid #4CAF50; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #ui { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; font-size: 14px; z-index: 100; }
        #ui h2 { color: #4CAF50; margin-bottom: 10px; }
        .key { background: #333; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #555; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; z-index: 50; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
        #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
        #stats { position: absolute; bottom: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; font-size: 13px; z-index: 100; }
        #grab-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4CAF50; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 51; display: none; }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div><p style="margin-top: 20px;">Carregando física...</p></div>
    <div id="canvas-container">
        <div id="ui">
            <h2>🎮 Controles</h2>
            <div style="margin: 5px 0;"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Mover</div>
            <div style="margin: 5px 0;"><span class="key">Shift</span> Correr</div>
            <div style="margin: 5px 0;"><span class="key">Espa&ccedil;o</span> Pular</div>
            <div style="margin: 5px 0;"><span class="key">Mouse</span> Olhar</div>
            <div style="margin: 5px 0;"><span class="key">Clique</span> Agarrar</div>
        </div>
        <div id="stats">
            <div>Velocidade: <span id="speed">0</span> m/s</div>
            <div>Posi&ccedil;&atilde;o: <span id="pos">0, 0, 0</span></div>
            <div>No ch&atilde;o: <span id="grounded">✓</span></div>
        </div>
        <div id="crosshair"></div>
        <div id="grab-indicator">PEGAR</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        const PHYSICS = { gravity: -9.82, playerMass: 70, playerHeight: 1.8, playerRadius: 0.5, walkSpeed: 5, runSpeed: 10, jumpForce: 5, grabDistance: 4, throwForce: 15 };
        let scene, camera, renderer, controls, world, physicsBodies = [], visualMeshes = [], playerBody, heldObject = null, heldBody = null, holdConstraint = null, raycaster;
        const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
        const direction = new THREE.Vector3();
        let canJump = false;
        const speedEl = document.getElementById('speed'), posEl = document.getElementById('pos'), groundedEl = document.getElementById('grounded');

        function init() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x87CEEB); scene.fog = new THREE.Fog(0x87CEEB, 20, 100);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, PHYSICS.playerHeight, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(50, 50, 50); dirLight.castShadow = true;
            dirLight.shadow.camera.left = -50; dirLight.shadow.camera.right = 50; dirLight.shadow.camera.top = 50; dirLight.shadow.camera.bottom = -50;
            scene.add(dirLight);
            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => { if (!controls.isLocked) controls.lock(); else tryGrab(); });
            scene.add(controls.getObject()); raycaster = new THREE.Raycaster();
            world = new CANNON.World(); world.gravity.set(0, PHYSICS.gravity, 0); world.broadphase = new CANNON.SAPBroadphase(world); world.allowSleep = true;
            createFloor(); createPlayer(); createObjects(); setupEventListeners();
            document.getElementById('loading').style.display = 'none'; console.log('✅ Física do personagem carregada!'); animate();
        }

        function createPlayer() {
            const playerShape = new CANNON.Cylinder(PHYSICS.playerRadius, PHYSICS.playerRadius, PHYSICS.playerHeight, 8);
            playerBody = new CANNON.Body({ mass: PHYSICS.playerMass, position: new CANNON.Vec3(0, PHYSICS.playerHeight, 0), shape: playerShape, linearDamping: 0.9, angularDamping: 0.9, fixedRotation: true });
            world.addBody(playerBody);
            playerBody.addEventListener('collide', (e) => { const contactNormal = new CANNON.Vec3(); e.contact.ni.negate(contactNormal); if (contactNormal.y > 0.5) canJump = true; });
            console.log('✅ Personagem criado com física');
        }

        function createFloor() {
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x3a5f3a, roughness: 0.8 }));
            floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
            const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() }); floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(floorBody);
            console.log('✅ Ch&atilde;o criado');
        }

        function createObjects() {
            const geometries = [{ type: 'box', geo: new THREE.BoxGeometry(1, 1, 1) }, { type: 'sphere', geo: new THREE.SphereGeometry(0.6, 32, 32) }, { type: 'cylinder', geo: new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32) }];
            const colors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff];
            for (let i = 0; i < 20; i++) {
                const item = geometries[Math.floor(Math.random() * geometries.length)];
                const mesh = new THREE.Mesh(item.geo, new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] }));
                mesh.position.set((Math.random() - 0.5) * 30, 2 + Math.random() * 5, (Math.random() - 0.5) * 30); mesh.castShadow = true; scene.add(mesh); visualMeshes.push(mesh);
                let shape = item.type === 'box' ? new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)) : item.type === 'sphere' ? new CANNON.Sphere(0.6) : new CANNON.Cylinder(0.5, 0.5, 1.5, 32);
                const body = new CANNON.Body({ mass: 1 + Math.random() * 4, shape: shape, position: new CANNON.Vec3(mesh.position.x, mesh.position.y, mesh.position.z), linearDamping: 0.5, angularDamping: 0.5 });
                world.addBody(body); physicsBodies.push(body); mesh.userData.physicsBody = body;
            }
            console.log('✅ Objetos criados:', visualMeshes.length);
        }

        function setupEventListeners() {
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true; if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
                if (e.code === 'ShiftLeft') keys.shift = true; if (e.code === 'Space') { keys.space = true; if (canJump) jump(); }
            });
            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false; if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
                if (e.code === 'ShiftLeft') keys.shift = false; if (e.code === 'Space') keys.space = false;
            });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }

        function jump() { if (!canJump) return; playerBody.velocity.y = PHYSICS.jumpForce; canJump = false; console.log('🦘 Pulo!'); }

        function updatePlayerPhysics(delta) {
            if (!controls.isLocked) return;
            direction.z = Number(keys.w) - Number(keys.s); direction.x = Number(keys.d) - Number(keys.a); direction.normalize();
            const speed = keys.shift ? PHYSICS.runSpeed : PHYSICS.walkSpeed;
            const cameraDirection = new THREE.Vector3(); camera.getWorldDirection(cameraDirection); cameraDirection.y = 0; cameraDirection.normalize();
            const cameraRight = new THREE.Vector3(); cameraRight.crossVectors(cameraDirection, new THREE.Vector3(0, 1, 0));
            const targetVelocity = new CANNON.Vec3(0, playerBody.velocity.y, 0);
            if (keys.w || keys.s) { targetVelocity.x += cameraDirection.x * direction.z * speed; targetVelocity.z += cameraDirection.z * direction.z * speed; }
            if (keys.a || keys.d) { targetVelocity.x += cameraRight.x * direction.x * speed; targetVelocity.z += cameraRight.z * direction.x * speed; }
            playerBody.velocity.x = targetVelocity.x; playerBody.velocity.z = targetVelocity.z;
            camera.position.copy(playerBody.position); camera.position.y += PHYSICS.playerHeight / 2;
            updateStats();
        }

        function updateStats() {
            const vel = playerBody.velocity; const speed = Math.sqrt(vel.x * vel.x + vel.z * vel.z); speedEl.textContent = speed.toFixed(2);
            const pos = playerBody.position; posEl.textContent = pos.x.toFixed(1) + ', ' + pos.y.toFixed(1) + ', ' + pos.z.toFixed(1);
            groundedEl.textContent = canJump ? '✓' : '✗'; groundedEl.style.color = canJump ? '#4CAF50' : '#ff4444';
        }

        function tryGrab() {
            if (heldObject) releaseObject();
            else {
                const rayDir = new THREE.Vector3(); camera.getWorldDirection(rayDir); raycaster.set(camera.position, rayDir); raycaster.far = PHYSICS.grabDistance;
                const intersects = raycaster.intersectObjects(visualMeshes);
                if (intersects.length > 0) { const body = intersects[0].object.userData.physicsBody; if (body && body.mass > 0) holdObject(intersects[0].object, body); }
            }
        }

        function holdObject(mesh, body) {
            heldObject = mesh; heldBody = body;
            const holdDir = new THREE.Vector3(); camera.getWorldDirection(holdDir); const holdPos = holdDir.multiplyScalar(2.5).add(camera.position);
            const holdBody = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(holdPos.x, holdPos.y, holdPos.z) }); world.addBody(holdBody);
            holdConstraint = new CANNON.PointToPointConstraint(body, new CANNON.Vec3(0,0,0), holdBody, new CANNON.Vec3(0,0,0)); world.addConstraint(holdConstraint);
            body.linearDamping = 0.9; document.getElementById('grab-indicator').style.display = 'none';
        }

        function releaseObject() {
            if (!heldBody) return;
            const throwDir = new THREE.Vector3(); camera.getWorldDirection(throwDir); throwDir.multiplyScalar(PHYSICS.throwForce);
            heldBody.velocity.set(throwDir.x, throwDir.y * 0.5, throwDir.z);
            world.removeConstraint(holdConstraint); world.removeBody(heldBody);
            heldObject = null; heldBody = null; holdConstraint = null;
        }

        function animate() {
            requestAnimationFrame(animate); world.step(1/60);
            for (let i = 0; i < physicsBodies.length; i++) { visualMeshes[i].position.copy(physicsBodies[i].position); visualMeshes[i].quaternion.copy(physicsBodies[i].quaternion); }
            if (heldBody) { const holdDir = new THREE.Vector3(); camera.getWorldDirection(holdDir); const holdPos = holdDir.multiplyScalar(2.5).add(camera.position); heldBody.position.set(holdPos.x, holdPos.y, holdPos.z); }
            updatePlayerPhysics(1/60); renderer.render(scene, camera);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
