<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Viewer</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font:14px system-ui,sans-serif;background:#0f1724;color:#fff;min-height:100vh;display:grid;place-items:center}.container{max-width:600px;width:100%;padding:20px;text-align:center}h1{margin-bottom:12px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:20px 0}.card{background:#1a2f44;border:1px solid #2d5a7a;border-radius:12px;padding:12px;cursor:pointer;transition:.2s}.card:hover{border-color:#48b9e6;transform:translateY(-2px)}.card b{display:block;margin:8px 0 4px;font-size:13px}.card small{color:#8ad5ff88;font-size:11px}.tag{display:inline-block;background:#123354cc;padding:3px 8px;border-radius:6px;font-size:10px;margin-top:6px}.btn{display:inline-block;background:#48b9e6;color:#0f1724;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}.btn:active{transform:scale(.98)}#preview{margin-top:20px;padding:16px;background:#1a2f44;border-radius:12px;display:none}#preview h3{margin-bottom:8px}#preview p{color:#8ad5ff88;margin-bottom:12px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}@media(max-width:480px){.grid{grid-template-columns:1fr}.card{min-width:unset}}</style></head><body><div class="container"><h1>📱 AR Viewer</h1><p>Escolha um modelo para visualizar em Realidade Aumentada</p><div class="grid" id="models"></div><div id="preview"><h3 id="previewTitle"></h3><p id="previewDesc"></p><div class="actions"><a id="arBtn" class="btn" target="_blank" rel="noopener">🚀 Abrir em AR</a><a id="downloadBtn" class="btn" style="background:#2d5a7a" download>⬇️ Baixar</a></div></div></div><script>
const models=[{name:"Mini Modern House",file:"Mini_modern_house.glb",desc:"Casa moderna minimalista",tags:["glb","webxr","quicklook"]},{name:"Mech",file:"Mech by Quaternius - o3Ps8z8ByP.glb",desc:"Rob&ocirc; mec&acirc;nico (CC0)",tags:["glb","webxr","quicklook"]},{name:"Realistic Interior",file:"realistic+interior.glb",desc:"Interior realista",tags:["glb","webxr","quicklook"]},{name:"Appartement",file:"appartement.glb",desc:"Apartamento",tags:["glb","webxr","quicklook"]},{name:"McLaren P1 GTR",file:"McLaren_P1_GTR_2015.usdz",desc:"Carro esportivo (iOS)",tags:["usdz","quicklook"]}];
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
const grid=document.getElementById("models");
models.forEach((m,i)=>{const card=document.createElement("div");card.className="card";card.innerHTML=`<b>${m.name}</b><small>${m.desc}</small><div>${m.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;card.onclick=()=>showPreview(i);grid.appendChild(card)});
function showPreview(i){const m=models[i],p=document.getElementById("preview");document.getElementById("previewTitle").textContent=m.name;document.getElementById("previewDesc").textContent=m.desc+"\nFormato: "+m.tags.join(", ");const base="https://github.com/Afonsonpjr/jogo-3d-web-threejs/raw/main/Materials/";const arUrl=isIOS&&m.file.endsWith(".usdz")?base+encodeURIComponent(m.file):base+encodeURIComponent(m.file)+"#ar=1";document.getElementById("arBtn").href=arUrl;document.getElementById("downloadBtn").href=base+encodeURIComponent(m.file);p.style.display="block"}
</script></body></html>
