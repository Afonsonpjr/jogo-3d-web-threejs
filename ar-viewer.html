<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Viewer</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font:14px system-ui,sans-serif;background:linear-gradient(135deg,#0f1724,#1a2f44);color:#fff;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}h1{font-size:24px;margin-bottom:8px;text-align:center}.subtitle{color:#8ad5ff88;text-align:center;margin-bottom:24px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:30px}.card{background:#1a2f44;border:1px solid #2d5a7a;border-radius:14px;padding:14px;cursor:pointer;transition:.2s}.card:hover{border-color:#48b9e6;transform:translateY(-3px)}.card b{display:block;margin-bottom:6px;font-size:14px}.card small{color:#8ad5ff88;font-size:12px;display:block;margin-bottom:8px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#123354cc;padding:3px 8px;border-radius:6px;font-size:10px;color:#8ad5ff}.viewer{background:#0f1724;border:1px solid #2d5a7a;border-radius:16px;padding:16px;margin-top:20px;display:none}model-viewer{width:100%;height:400px;background:#0a0f1a;border-radius:12px}@media(max-width:768px){.grid{grid-template-columns:1fr}model-viewer{height:320px}}</style></head><body><div class="container"><h1>📱 AR Viewer</h1><p class="subtitle">Visualize modelos 3D em Realidade Aumentada no seu celular</p><div class="grid" id="models"></div><div class="viewer" id="viewer"><model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="2" ar ar-modes="webxr scene-viewer quick-look" environment-image="neutral" poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231a2f44' width='100' height='100'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%2348b9e6' font-size='12'%3ECarregando...%3C/text%3E%3C/svg%3E"></model-viewer><p style="text-align:center;margin-top:12px;font-size:12px;color:#8ad5ff88">Toque no &iacute;cone AR no celular ou use os controles no PC</p></div></div><script>
const models=[{name:"Mini Modern House",file:"Mini_modern_house.glb",desc:"Casa moderna minimalista",tags:["glb","webxr","quicklook"]},{name:"Mech",file:"Mech by Quaternius - o3Ps8z8ByP.glb",desc:"Rob&ocirc; mec&acirc;nico (CC0)",tags:["glb","webxr","quicklook"]},{name:"Realistic Interior",file:"realistic+interior.glb",desc:"Interior realista",tags:["glb","webxr","quicklook"]},{name:"Appartement",file:"appartement.glb",desc:"Apartamento",tags:["glb","webxr","quicklook"]},{name:"McLaren P1 GTR",file:"McLaren_P1_GTR_2015.usdz",desc:"Carro esportivo (iOS)",tags:["usdz","quicklook"]}];
const base="https://github.com/Afonsonpjr/jogo-3d-web-threejs/raw/main/Materials/";
const grid=document.getElementById("models"),viewer=document.getElementById("viewer"),mv=document.getElementById("mv");
models.forEach((m,i)=>{const card=document.createElement("div");card.className="card";card.innerHTML=`<b>${m.name}</b><small>${m.desc}</small><div class="tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;card.onclick=()=>loadModel(m);grid.appendChild(card)});
function loadModel(m){viewer.style.display="block";mv.src=base+encodeURIComponent(m.file);mv.setAttribute("alt",m.name+" - "+m.desc);window.scrollTo({top:viewer.offsetTop-20,behavior:"smooth"})}
</script></body></html>
